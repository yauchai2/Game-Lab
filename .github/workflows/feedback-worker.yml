name: Deploy feedback Worker

on:
  workflow_dispatch:
  push:
    branches:
      - codex/feedback-service-setup
    paths:
      - services/feedback/**
      - .github/workflows/feedback-worker.yml

permissions:
  contents: read

concurrency:
  group: feedback-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deployment dependencies
        run: npm install --package-lock=false
      - name: Run feedback service unit tests
        working-directory: .
        run: node tools/test_feedback_worker.mjs
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FEEDBACK_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c516539d1c4f0ec5b48e531e35190bcb
        run: npm run deploy
      - name: Verify real feedback delivery (explicit opt-in)
        if: contains(github.event.head_commit.message, '[live-feedback-test]')
        run: node live-smoke.mjs
      - name: Build configured game candidate
        working-directory: .
        run: |
          mkdir -p /tmp/game-lab-feedback-evidence
          python3 tools/build.py /tmp/game-lab-feedback-evidence/idle-hero-feedback-candidate.html
      - name: Upload verification and candidate
        uses: actions/upload-artifact@v4
        with:
          name: feedback-candidate-and-evidence
          path: /tmp/game-lab-feedback-evidence/
          retention-days: 14
