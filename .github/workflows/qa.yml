name: qa

# 舊功能保護網：每次推送或 PR 都跑快速關卡；紅燈代表有舊功能被改壞，不應合併或出 Release。
on:
  push:
    branches-ignore: [gh-pages]
    paths: ['src/**', 'index.html', 'assets/**', 'tools/**', '.github/workflows/qa.yml']
  pull_request:
    paths: ['src/**', 'index.html', 'assets/**', 'tools/**', '.github/workflows/qa.yml']
  workflow_dispatch:
    inputs:
      full:
        description: '跑完整關卡（掛機 2 小時，較慢）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 需要完整歷史與 tag，才能和上一個正式版比對
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 Playwright 與 Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: 出版前關卡
        run: python3 tools/qa/gate.py ${{ inputs.full && ' ' || '--quick' }}
      - name: 報告摘要
        if: always()
        run: |
          [ -f docs/qa/reports/latest.md ] && cat docs/qa/reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: docs/qa/reports/latest.md
