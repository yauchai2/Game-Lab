name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag，例如 v0.38.4'
        required: true
      title:
        description: 'Release 標題'
        required: true
      target:
        description: '要打 Tag 的 commit（完整 SHA，說明檔讀自預設分支）'
        required: true
      notes_file:
        description: '說明檔路徑，例如 docs/release-notes/v0.38.4.md'
        required: true

      prerelease:
        description: '標為預發佈（開發中版本，不算最新正式版）'
        type: boolean
        default: false
      upload_standalone:
        description: '附上指定來源提交的離線單檔'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.notes_file }}
          PRE: ${{ inputs.prerelease }}
        run: |
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          FLAGS=""; if [ "$PRE" = "true" ]; then FLAGS="--prerelease"; else FLAGS="--latest"; fi
          gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes-file "$NOTES" $FLAGS
      - name: Attach exact standalone build
        if: ${{ inputs.upload_standalone }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          git fetch --depth=1 origin "$TARGET"
          git show "$TARGET:dist/idle-hero.html" > "$RUNNER_TEMP/idle-hero.html"
          gh release upload "$TAG" "$RUNNER_TEMP/idle-hero.html"
