<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配件拼圖原型</title>
<style>
  :root { --bg:#0e1230; --panel:#1a2150; --edge:#6f7cd6; --text:#eef1ff; --muted:#9aa3d9; --act:#ff9ec7; --sup:#8fe3ff; --ok:#9dffcf; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,'PingFang TC','Microsoft JhengHei',sans-serif; }
  main { max-width:520px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.hint { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .win { background:var(--panel); border:2px solid var(--edge); border-radius:6px; padding:10px; margin-bottom:12px; }
  .win h2 { font-size:13px; margin:0 0 8px; color:var(--muted); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; color:var(--text); background:#262f6e; border:2px solid var(--edge); border-radius:4px; padding:6px 10px; cursor:pointer; min-height:40px; }
  button.on { background:var(--edge); color:#0e1230; font-weight:700; }
  button.act { border-color:var(--act); } button.sup { border-color:var(--sup); }
  #board { display:grid; gap:4px; margin:0 auto; width:100%; max-width:360px; }
  .cell { aspect-ratio:1; background:#10163f; border:2px dashed #38438f; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; text-align:center; padding:2px; cursor:pointer; position:relative; }
  .cell.act { background:var(--act); border:2px solid #fff; color:#2a0d1c; font-weight:700; }
  .cell.sup { background:var(--sup); border:2px solid #fff; color:#06222c; font-weight:700; }
  .cell.sel { outline:3px solid var(--ok); outline-offset:1px; }
  .cell.lnk { box-shadow:0 0 0 3px var(--ok) inset; }
  .cell.bad { border-color:#ff6b6b; }
  #info div { padding:2px 0; font-size:14px; }
  #info b { color:var(--act); }
  #msg { min-height:20px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>配件拼圖原型</h1>
  <p class="hint">選一個機件，點格子放下。點已放的機件可選取，再按旋轉或移除。粉紅是主動機件，藍色是輔助配件，只強化上下左右相鄰且標籤相符的主動機件。</p>

  <div class="win"><h2>主動機件</h2><div class="row" id="pa"></div></div>
  <div class="win"><h2>輔助配件</h2><div class="row" id="ps"></div></div>
  <div class="win"><h2>面板</h2><div id="board"></div>
    <div class="row" style="margin-top:8px;justify-content:center">
      <button id="rot">旋轉</button><button id="del">移除</button><button id="clr">清空</button>
    </div>
    <div id="msg"></div>
  </div>
  <div class="win" id="info"><h2>結算</h2><div id="out">尚未放置機件</div></div>
  <div class="win"><h2>訓練假人（英雄：武器傷害 100，暴擊率 5%，暴擊傷害 150%）</h2>
    <div id="dum" style="height:14px;background:#10163f;border:2px solid var(--edge);border-radius:4px;overflow:hidden"><div id="dhp" style="height:100%;width:100%;background:#ff6b8b"></div></div>
    <div class="row" style="margin-top:8px"><button id="hit">打 10 秒</button><span id="dres" style="align-self:center;color:var(--muted);font-size:13px"></span></div>
  </div>
</main>
<script src="../src/lab/grid.js"></script>
<script>
const G = window.GridLab, b = G.createBoard(3, 3);
let pick = null, sel = null; // pick: {kind,key} 準備放置；sel: 已選取的 piece id
const $ = id => document.getElementById(id), name = (k, key) => (k === 'active' ? G.ACTIVES : G.SUPPORTS)[key].n;
const TAG = { proj:'投射物', area:'範圍', fire:'熱', cold:'冷', light:'電' };

function mk(box, kind, defs) {
  for (const key in defs) {
    const e = document.createElement('button');
    e.className = kind === 'active' ? 'act' : 'sup';
    e.textContent = defs[key].n;
    e.dataset.k = kind + ':' + key;
    e.onclick = () => { pick = { kind, key }; sel = null; draw(); $('msg').textContent = '點格子放下「' + defs[key].n + '」'; };
    box.appendChild(e);
  }
}
mk($('pa'), 'active', G.ACTIVES); mk($('ps'), 'support', G.SUPPORTS);

function cellClick(x, y) {
  const hit = b.pieces.find(p => G.cellsOf(p).some(c => c[0] === x && c[1] === y));
  if (hit) { sel = hit.id; pick = null; $('msg').textContent = '已選取「' + name(hit.kind, hit.key) + '」'; return draw(); }
  if (!pick) return;
  if (G.place(b, pick.kind, pick.key, x, y, 0)) $('msg').textContent = '';
  else $('msg').textContent = '這裡放不下（重疊或超出面板）';
  draw();
}
$('rot').onclick = () => { if (sel == null) return; $('msg').textContent = G.rotate(b, sel) ? '' : '旋轉後放不下'; draw(); };
$('del').onclick = () => { if (sel != null) G.remove(b, sel); sel = null; draw(); };
$('clr').onclick = () => { b.pieces.length = 0; sel = null; draw(); };

function draw() {
  document.querySelectorAll('[data-k]').forEach(e => e.classList.toggle('on', !!pick && e.dataset.k === pick.kind + ':' + pick.key));
  const board = $('board'); board.style.gridTemplateColumns = 'repeat(' + b.w + ',1fr)'; board.innerHTML = '';
  const res = G.resolve(b), linkedIds = new Set(res.flatMap(r => r.linked));
  const at = {};
  for (const p of b.pieces) G.cellsOf(p).forEach((c, i) => { at[c[0] + ',' + c[1]] = { p, first: i === 0 }; });
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    const d = document.createElement('div'), h = at[x + ',' + y];
    d.className = 'cell';
    if (h) {
      d.classList.add(h.p.kind === 'active' ? 'act' : 'sup');
      if (h.p.id === sel) d.classList.add('sel');
      if (linkedIds.has(h.p.id)) d.classList.add('lnk');
      if (h.first) d.textContent = name(h.p.kind, h.p.key);
    }
    d.onclick = () => cellClick(x, y);
    board.appendChild(d);
  }
  const out = res.map(r => {
    const s = r.stat, parts = [];
    if (s.dmg) parts.push('傷害 ' + (s.dmg > 0 ? '+' : '') + Math.round(s.dmg * 100) + '%');
    if (s.cd) parts.push('冷卻 ' + Math.round(s.cd * 100) + '%');
    if (s.area) parts.push('範圍 +' + Math.round(s.area * 100) + '%');
    if (s.crit) parts.push('暴擊率 +' + Math.round(s.crit * 100) + '%');
    if (s.repeat) parts.push('重複施放 ×' + s.repeat);
    return '<div><b>' + G.ACTIVES[r.key].n + '</b>（' + G.ACTIVES[r.key].tags.map(t => TAG[t]).join('、') + '）：' + (parts.join('，') || '沒有加成') + '</div>';
  });
  const HERO = { hit: 100, crit: 5, cm: 150 }, ds = G.dps(b, HERO);
  window._dps = ds.reduce((a, r) => a + r.dps, 0);
  const dpsOf = id => (ds.find(r => r.id === id) || {}).dps || 0;
  for (let i = 0; i < out.length; i++) out[i] = out[i].replace('</div>', '，DPS ' + Math.round(dpsOf(res[i].id)) + '</div>');
  $('out').innerHTML = out.length ? out.join('') : '尚未放置機件';
}
let timer = null;
$('hit').onclick = () => {
  clearInterval(timer); const total = window._dps * 10 || 0, max = 3000; let t = 0;
  $('dres').textContent = total ? '' : '先放一個主動機件';
  if (!total) return;
  timer = setInterval(() => {
    t += 0.5; const dealt = window._dps * t;
    $('dhp').style.width = Math.max(0, 100 - dealt / max * 100) + '%';
    $('dres').textContent = t + ' 秒：累計 ' + Math.round(dealt) + '，總 DPS ' + Math.round(window._dps);
    if (t >= 10) clearInterval(timer);
  }, 100);
};
draw();
</script>
</body>
</html>
