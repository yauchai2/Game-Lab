<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打造與血條｜UI/UX 檢視樣板</title>
<style>

t-weight:400;margin:3px 0}.meta,.muted{color:var(--muted);font-size:14px}.rarity{color:#8a4218}.affixes{margin:0;padding:0;list-style:none}.affixes li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #bfc6de}.affixes small{color:var(--muted);margin-left:auto}.tier{font-size:13px;min-width:30px}.special{padding:9px 10px;border-left:3px solid #a76c2e;background:#f2e8d7;margin-bottom:8px;font-size:14px}h3{font-size:18px;font-weight:400;margin:18px 0 10px}.operations{display:grid;grid-template-columns:1fr 1fr;gap:6px}.operations button{text-align:left}.operations b{display:block;font-weight:400}.operations span{font-size:13px;display:block;opacity:.9}.process{padding:12px 0;margin-top:8px}.process p{margin:6px 0}.costs{display:grid;gap:4px;padding:8px 0;list-style:none;margin:0}.costs li{display:flex;justify-content:space-between;gap:12px}.result-preview{padding:10px;border:1px solid var(--edge);background:#f6f7ff;margin:12px 0}.reason{color:var(--danger);font-size:14px}.execute{width:100%;margin-top:8px}.danger-section{border-top:1px solid #a67a8e;margin-top:12px;padding-top:12px}.danger-button{color:var(--danger);width:100%;text-align:left}details{margin-top:12px}summary{cursor:pointer;min-height:44px;padding:10px 0}.utilities{display:grid;grid-template-columns:1fr 1fr;gap:8px}.utilities button{text-align:left}.utilities p{margin:0;grid-column:1/-1}.fixture{max-width:680px;margin:14px auto;color:#edf1ff;font-size:14px}.fixture select{color:var(--ink);max-width:100%;padding:8px 10px;min-height:44px;background:#f2f4ff}.fixture label{display:block;margin:8px 0}dialog{max-width:min(540px,calc(100vw - 24px));border:2px solid #98a7ca;background:var(--screen);color:var(--ink);padding:18px;font:inherit}dialog::backdrop{background:#101b48aa}dialog h2{font-size:20px;font-weight:400}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.dialog-actions button{flex:1}.health-window{max-width:1120px;margin:12px auto;background:var(--screen);border:3px solid #a9b6d5}.health-tools{padding:14px;display:flex;gap:8px;flex-wrap:wrap}.field{position:relative;width:100%;isolation:isolate;background:#70a6b8;overflow:hidden}.field>img{display:block;width:100%;height:auto;image-rendering:pixelated}.field>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.readout{position:absolute;background:#142747e8;padding:5px 8px;font-size:12px;color:#fff;min-width:100px;max-width:45%;line-height:1.3;pointer-events:none}.readout i{display:block;height:3px;background:#070f24;margin-top:3px}.readout i b{display:block;height:100%;background:#e57866}.readout.player{left:8px;top:8px}.readout.player b{background:#62cf9c}.readout.boss{right:8px;top:8px;min-width:150px}.readout.target{left:8px;bottom:8px;max-width:65%}.metrics{padding:12px 14px;font-size:14px}.metrics p{margin:3px 0}.status{max-width:680px;margin:12px auto;color:#fff;font-size:14px;min-height:24px}[hidden]{display:none!important}a{color:inherit}@media(max-width:480px){header.review{padding-top:14px}header h1{font-size:20px}.body{padding:12px}.operations{gap:5px}.operations button{padding:8px;font-size:14px}.operations span{font-size:12px}.item-head{grid-template-columns:60px 1fr;gap:8px}.item-head img{width:56px;height:56px}.item-head h2{font-size:18px}.wallet{gap:10px}.wallet b{font-size:16px}.tabs button{font-size:14px;padding:7px}.readout{font-size:10px;max-width:45%;min-width:80px}.readout.boss{min-width:125px}.health-tools{padding:9px}.health-tools button{font-size:14px;padding:6px 9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(forced-colors:active){button[aria-pressed=true]{outline:3px solid Highlight}.field svg{forced-color-adjust:none}}
</style><script>/*__FONT__*/</script>
<header class="review"><h1>打造與血條 · UI/UX 樣板</h1><p>只供檢視介面與顯示策略，不讀寫遊戲存檔。</p><nav aria-label="檢視範圍"><button id="nav-craft" aria-pressed="true">打造頁</button><button id="nav-health" aria-pressed="false">血條方案</button></nav></header>
<main><section id="craft-view"><div class="window"><div class="window-title">打造</div><div class="body"><div class="wallet"><span>零件 <b id="parts"></b></span><span>傳奇殘晶 <b id="dust"></b></span><span>電路點數 <b id="chips"></b></span></div><div class="tabs" role="group" aria-label="打造分類"><button id="tab-upgrade" aria-pressed="true">裝備強化</button><button id="tab-supply" aria-pressed="false">資源與補給</button></div><div id="upgrade"></div><div id="supply" hidden><h2>資源與補給</h2><div class="utilities"><button data-utility="shop">金幣補給站<br><small>裝備補給、擴充背包與離線上限</small></button><button data-utility="synth">合成配件與卡匣<br><small>使用電路點數</small></button><p class="muted">拾取與回收規則移至背包的「拾取設定」，強化頁只保留單一入口連結。</p></div><p id="utility-note" class="muted"></p></div></div></div><aside class="fixture" aria-label="樣板測試資料"><label>檢視裝備樣本 <select id="fixture"></select></label><label><input id="poor" type="checkbox"> 檢查材料不足狀態</label><p>材料與資格取自目前遊戲函式的控制樣本；選擇不會裝備、扣費或改動角色。</p></aside></section>
<section id="health-view" hidden><div class="health-window"><div class="window-title">世界血條 · 同場景比較</div><div class="health-tools" role="group" aria-label="鏡頭距離"><button data-zoom="far">拉遠</button><button data-zoom="middle">一般</button><button data-zoom="near">拉近</button></div><div class="health-tools" role="group" aria-label="血條方案"><button id="before" aria-pressed="false">原本粗條</button><button id="after" aria-pressed="true">薄條與顯示優先序</button></div><div id="field" class="field"><img id="field-image" alt="遊戲原生30隻受傷怪物場景"><svg id="bars" aria-hidden="true"></svg><div id="hud"></div></div><div id="metrics" class="metrics"></div></div></section></main>
<div id="status" class="status" role="status" aria-live="polite"></div><dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><div id="confirm-body"></div><div class="dialog-actions"><button id="cancel">返回修改</button><button id="finish" class="primary">完成檢視</button></div></dialog>
<script>/*__POLICY__*/</script><script>
/*__DATA__*/
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'craft',fixture:'city',op:'refine',affix:0,poor:false,tab:'upgrade',zoom:'middle',before:false,lastTrigger:null};
const OPS={recal:['重洗詞綴數值','保留種類與階級，數值可能升或降。'],swap:['隨機替換詞綴','隨機換掉一條未鎖定詞綴。'],upgrade:['提升稀有度','普通 → 魔法 → 稀有，不會變成傳奇。'],extend:['新增詞綴','稀有裝備最多六條。'],tier:['提升詞綴階級','指定一條詞綴，每次提升一階；T0最高。'],refine:['提升物品等級','城市傳奇限定，物品等級增加一級。'],corrupt:['腐化裝備','有風險的最後改裝；完成後不能再強化。']};
function row(){return CRAFT_DATA.cases.find(r=>r.id===state.fixture)}
function availableOps(r){if(!r.item)return[];if(r.item.corrupt)return[];const a=['recal'];if(!r.item.lg)a.push('swap');if(r.item.r<2)a.push('upgrade');if(r.item.r===2&&!r.item.lg)a.push('extend');a.push('tier');if(r.item.lg)a.push('refine');return a}
function operation(r){let s;if(state.op==='refine')s={...r.refine};else if(state.op==='tier')s={...r.tiers[state.affix]};else s={...r.operations[state.op],parts:r.operations[state.op]?.cost||0,fragments:0,dust:0};
 s.reason=s.reason?.replaceAll('核心殘晶','傳奇殘晶').replaceAll('城市核心重構','物品等級提升').replaceAll('核心重構','物品等級提升').replaceAll('傳奇核心','城市傳奇裝備').replaceAll('不能再改機','不能再強化')||'';
 if(state.op==='refine'&&!s.route)s.reason='這件傳奇不支援物品等級提升；可使用重洗數值或詞綴升階。';if(state.poor&&s.ok){s.ok=false;s.reason='零件不足，還差 '+Math.max(1,s.parts||0)+' 個；請先回收裝備取得零件。'}return s}
function costs(s){return `<ul class="costs"><li><span>零件</span><span>${s.parts||0}／持有 ${state.poor?0:CRAFT_DATA.resources.parts}</span></li>${s.fragments?`<li><span>${esc(s.routeName||'來源區域')}碎片</span><span>${s.fragments}／持有12</span></li>`:''}${s.dust?`<li><span>傳奇殘晶</span><span>${s.dust}／持有${CRAFT_DATA.resources.dust}</span></li>`:''}</ul>`}
function renderCraft(){const r=row(),it=r.item;$('parts').textContent=state.poor?'0':CRAFT_DATA.resources.parts;$('dust').textContent=CRAFT_DATA.resources.dust;$('chips').textContent=CRAFT_DATA.resources.chips;
 const ops=availableOps(r);if(!ops.includes(state.op)&&ops.length)state.op=ops.includes('refine')?'refine':ops[0];if(state.affix>=(r.tiers?.length||0))state.affix=0;
 let html=it?`<section class="item-head"><div>${it.icon}</div><div><span class="meta">目前穿著 · 武器</span><h2>${esc(it.name)}</h2><span class="rarity">${esc(it.rarity)}</span><span class="meta"> · 物品等級 ${it.il}${it.corrupt?' · 已腐化':''}</span></div></section>${it.special?`<div class="special">傳奇特效：${esc(it.special)}</div>`:''}<ul class="affixes"><li><span class="tier">基礎</span>${esc(it.implicit)}</li>${it.affixes.map(a=>`<li><span class="tier">T${a.tier}</span><span>${esc(a.text)}</span><small>${it.lg?'種類固定':a.locked?'已鎖定':''}</small></li>`).join('')}</ul>`:'<h2>先選擇一件穿著中的裝備</h2><p>這個欄位目前沒有裝備。請到背包選擇並穿上，再回來強化。</p>';
 if(it?.corrupt)html+='<p class="reason">已腐化，不能再強化。裝備及詞綴保持可讀。</p>';
 if(ops.length){const s=operation(r);html+=`<h3>選擇強化方式</h3><div class="operations" role="group" aria-label="強化方式">${ops.map(k=>`<button data-op="${k}" aria-pressed="${state.op===k}"><b>${OPS[k][0]}</b><span>${OPS[k][1]}</span></button>`).join('')}</div><section class="process" aria-label="強化詳情"><h3>${OPS[state.op][0]}</h3><p>${OPS[state.op][1]}</p>`;
 if(state.op==='tier')html+=`<label>選擇詞綴 <select id="affix">${r.tiers.map((a,i)=>`<option value="${i}" ${i===state.affix?'selected':''}>T${a.from} · ${esc(it.affixes[i].text)}</option>`).join('')}</select></label><div class="result-preview">T${s.from} → T${s.to} · ${esc(s.next||it.affixes[state.affix]?.text)}</div>`;
 if(state.op==='refine')html+=`<div class="result-preview">${s.route?`物品等級 ${it.il} → ${s.nextLevel} · 目前上限${s.cap}<br>保留傳奇特效、詞綴種類與階級；數值不降低。`:'只支援城市遠征的指定傳奇裝備。角色專裝不能套用這項提升。'}</div>`;
 if(state.op==='recal')html+='<p class="meta">只變更未鎖定詞綴的數值；不改詞綴種類、階級或傳奇特效。</p>';
 html+=costs(s)+`${s.reason?`<p class="reason" id="blocked-reason">${esc(s.reason)}</p>`:''}<button class="primary execute" id="preview-operation" ${s.ok?'':'disabled'} ${s.reason?'aria-describedby="blocked-reason"':''}>檢視消耗與變化</button></section><details class="danger-section"><summary>風險改裝</summary><p class="reason">腐化後不能再強化，結果可能變差。</p><button class="danger-button" id="corrupt">查看腐化風險</button></details>`;
 }
 $('upgrade').innerHTML=html;for(const b of document.querySelectorAll('[data-op]'))b.onclick=()=>{state.op=b.dataset.op;renderCraft();document.querySelector(`[data-op="${state.op}"]`)?.focus({preventScroll:true})};$('affix')?.addEventListener('change',e=>{state.affix=+e.target.value;renderCraft()});$('preview-operation')?.addEventListener('click',()=>openConfirm(state.op));$('corrupt')?.addEventListener('click',()=>openConfirm('corrupt'));}
function openConfirm(op){state.lastTrigger=document.activeElement;const r=row(),s=op==='corrupt'?{...r.operations.corrupt,parts:r.operations.corrupt.cost}:operation(r);$('confirm-title').textContent=OPS[op][0]+'：'+r.item.name;$('confirm-body').innerHTML=op==='corrupt'?`<p class="reason">腐化後無法再強化。</p><ul><li>25%：詞綴數值＋20%</li><li>25%：新增一條詞綴；已滿時沒有變化</li><li>25%：沒有變化</li><li>25%：詞綴數值－15%</li></ul>${costs(s)}`:`<p>${OPS[op][1]}</p>${costs(s)}${op==='refine'?`<p>物品等級 ${r.item.il} → ${s.nextLevel}；傳奇特效保留。</p>`:''}<p class="meta">隨機操作不能預先保證結果；正式遊戲確認時仍須重驗裝備、成本與挑戰狀態。</p>`;$('confirm').showModal();$('cancel').focus()}
function closeConfirm(message){$('confirm').close();if(message)$('status').textContent=message;state.lastTrigger?.focus({preventScroll:true})}
function show(view){state.view=view;$('craft-view').hidden=view!=='craft';$('health-view').hidden=view!=='health';$('nav-craft').setAttribute('aria-pressed',view==='craft');$('nav-health').setAttribute('aria-pressed',view==='health');if(view==='health')renderHealth()}
function renderHealth(){const shot=HEALTH_DATA.shots.find(s=>s.name===state.zoom);$('field-image').src=shot.src;const W=$('field').clientWidth||900,r=HealthbarReview.layout(shot,W),svg=$('bars');svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML=state.before?r.old.map(b=>`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.h/2}" fill="${b.fill}" opacity="${b.opacity}"/>`).join(''):r.bars.map(b=>`<g data-bar="${b.id}"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#14213d"/><rect x="${b.x}" y="${b.y}" width="${b.w*b.pct}" height="${b.h}" fill="${b.fill}"/></g>`).join('');
 const hud=(kind,name,hp)=>`<div class="readout ${kind}">${esc(name)} · ${Math.round(hp*100)}%<i><b style="width:${hp*100}%"></b></i></div>`;$('hud').innerHTML=state.before?'':hud('player','角色生命',r.playerHp)+r.bosses.slice(0,1).map(b=>hud('boss','首領生命',b.hp)).join('')+(r.targetFallback?hud('target','目前交戰目標',r.targetFallback.hp):'');
 const oldCount=shot.oldBars.filter(b=>b.fill==='#2b2552').length;$('metrics').innerHTML=`<p>${state.before?'原本：'+oldCount+' 條世界血條，受傷後持續顯示。':'方案：'+r.bars.length+' 條世界血條；首領與角色生命移至固定HUD。'}</p><p>普通怪僅優先顯示近期受傷／目前目標，密集時避讓；拉遠時減少數量。${r.targetFallback&&!state.before?'目標附近沒有空位，改由固定讀數顯示。':''}</p><p class="muted">場景為30隻受傷怪物的原生渲染；近期命中旗標為檢查樣本。這是顯示策略樣板，未改遊戲AI或目標。</p>`;for(const b of document.querySelectorAll('[data-zoom]'))b.setAttribute('aria-pressed',b.dataset.zoom===state.zoom);$('before').setAttribute('aria-pressed',state.before);$('after').setAttribute('aria-pressed',!state.before);window.healthLayout=r;}
$('fixture').innerHTML=CRAFT_DATA.cases.map(r=>`<option value="${r.id}" ${r.id===state.fixture?'selected':''}>${esc(r.label)}</option>`).join('');$('fixture').onchange=e=>{state.fixture=e.target.value;state.affix=0;renderCraft()};$('poor').onchange=e=>{state.poor=e.target.checked;renderCraft()};$('nav-craft').onclick=()=>show('craft');$('nav-health').onclick=()=>show('health');$('tab-upgrade').onclick=()=>{state.tab='upgrade';$('upgrade').hidden=false;$('supply').hidden=true;$('tab-upgrade').setAttribute('aria-pressed','true');$('tab-supply').setAttribute('aria-pressed','false')};$('tab-supply').onclick=()=>{state.tab='supply';$('upgrade').hidden=true;$('supply').hidden=false;$('tab-upgrade').setAttribute('aria-pressed','false');$('tab-supply').setAttribute('aria-pressed','true')};for(const b of document.querySelectorAll('[data-utility]'))b.onclick=()=>{$('utility-note').textContent=b.dataset.utility==='shop'?'正式介面沿用現有金幣補給站；此樣板不購買裝備或擴建。':'正式介面沿用現有配件／模式卡匣合成；每個配方列明消耗與放入位置。'};$('cancel').onclick=()=>closeConfirm();$('finish').onclick=()=>closeConfirm('檢視完成；未扣材料、未變更遊戲存檔。');$('confirm').addEventListener('cancel',e=>{e.preventDefault();closeConfirm()});for(const b of document.querySelectorAll('[data-zoom]'))b.onclick=()=>{state.zoom=b.dataset.zoom;renderHealth()};$('before').onclick=()=>{state.before=true;renderHealth()};$('after').onclick=()=>{state.before=false;renderHealth()};addEventListener('resize',()=>{if(state.view==='health')renderHealth()});renderCraft();if(new URLSearchParams(location.search).get('view')==='health')show('health');window.CraftHealthReview={state,row,operation,renderCraft,renderHealth,show};
</script></html>
