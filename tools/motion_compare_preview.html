<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色動作比較</title><style>body{margin:0;background:#172751;color:#edf1ff;font:16px/1.6 "Cubic 11",sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-weight:400;font-size:24px}button,select{min-height:44px;padding:8px 12px;font:inherit;background:#e6e8f7;color:#172751;border:2px solid #9ca9c8}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e1b354;outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair figure{margin:0;background:#e6e8f7;color:#172751;padding:8px;text-align:center}.pair img{width:100%;max-height:420px;object-fit:contain;image-rendering:pixelated}.pair figcaption{padding:8px}.note{font-size:14px;color:#cbd7f0}a{color:inherit}@media(max-width:480px){main{padding:16px}.pair{gap:6px}.pair figure{padding:3px}.pair figcaption{font-size:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><script>/*__FONT__*/</script><main><a href="preview.html">← 選角與 HUD 樣板</a><h1>角色動作 · 原生模型比較</h1><p class="note">控制條件下的動作樣本；未修改正式遊戲。可逐格觀察上身與下身的配合。</p><div class="controls"><label>職業 <select id="job"><option value="street">戰士</option><option value="frost">樂師</option><option value="beep">獵手</option><option value="volt">寵機師</option></select></label><label>動作 <select id="seq"><option value="run">奔跑</option><option value="attack">移動攻擊</option><option value="cast">移動施法</option><option value="roll">閃避翻滾</option></select></label><button id="play" aria-pressed="false">播放</button><button id="step">下一格</button></div><div class="pair"><figure><img id="before" alt="現行動作"><figcaption>現行</figcaption></figure><figure><img id="after" alt="動作修訂樣本"><figcaption>修訂樣本</figcaption></figure></div><p id="frame" role="status"></p><p class="note">修訂保留現有四肢比例、骨架和動畫。移動時混合下身步態與上身出招；普通攻擊取消額外整圈旋轉，翻滾以骨盆支點補償位移。未新增閃避觸發、無敵時間或技能傷害。</p><p class="note">目前每段12格／30fps，只示範前0.37秒，尚不是完整循環與自然戰鬥驗收。腳掌接地、轉身及高攻速銜接仍需後續調整。</p></main><script>const rows=/*__ROWS__*/;let i=0,timer=null;const $=id=>document.getElementById(id);function render(){for(const v of ['before','after'])$(v).src=rows.find(r=>r.job===$('job').value&&r.seq===$('seq').value&&r.variant===v).frames[i];$('frame').textContent='第 '+(i+1)+'／12 格'}function stop(){clearInterval(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false')}$('play').onclick=()=>{if(timer){stop();return}$('play').textContent='暫停';$('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{i=(i+1)%12;render()},1000/30)};$('step').onclick=()=>{stop();i=(i+1)%12;render()};for(const k of ['job','seq'])$(k).onchange=()=>{stop();i=0;render()};render();</script></html>
